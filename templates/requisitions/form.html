{% extends "base.html" %}

{% block title %}New Requisition{% endblock %}

{% block page_title %}New Requisition (S11){% endblock %}

{% block page_actions %}
<a href="{{ url_for('requisition_list') }}" class="btn">Back to Requisitions</a>
{% endblock %}

{% block content %}
<div class="card">
    <form method="POST" action="{{ url_for('requisition_new') }}">

        <div class="form-row">
            <div class="form-group">
                <label for="department_id">Requesting Department</label>
                <select id="department_id" name="department_id" class="form-control" required>
                    <option value="">-- Select Department --</option>
                    {% for department in departments %}
                    <option value="{{ department.id }}">{{ department.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="issue_point">Issue Point</label>
                <select id="issue_point" name="issue_point" class="form-control" required>
                    <option value="">-- Select Issue Point --</option>
                    {% for location in locations %}
                    <option value="{{ location }}">{{ location }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <h3 class="section-heading">Requisition Lines</h3>

        <table class="table" id="req-lines-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity Required</th>
                    <th>Remarks / Purpose</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="req-lines-body">
                <tr class="req-line-row">
                    <td>
                        <select name="item_id[]" class="form-control item-select" required>
                            <option value="">-- Select Item --</option>
                            {% for item in items %}
                            <option value="{{ item.id }}">{{ item.name }}</option>
                            {% endfor %}
                        </select>
                        <div class="line-stats-hint"></div>
                    </td>
                    <td>
                        <input type="number" name="quantity_required[]" class="form-control qty-input" step="0.01" min="0" required>
                    </td>
                    <td>
                        <input type="text" name="remarks[]" class="form-control" placeholder="Optional">
                    </td>
                    <td>
                        <button type="button" class="btn btn-sm remove-line-btn">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <button type="button" id="add-line-btn" class="btn">+ Add Line</button>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit Requisition</button>
            <a href="{{ url_for('requisition_list') }}" class="btn">Cancel</a>
        </div>

    </form>
</div>

<template id="req-line-template">
    <tr class="req-line-row">
        <td>
            <select name="item_id[]" class="form-control item-select" required>
                <option value="">-- Select Item --</option>
                {% for item in items %}
                <option value="{{ item.id }}">{{ item.name }}</option>
                {% endfor %}
            </select>
            <div class="line-stats-hint"></div>
        </td>
        <td>
            <input type="number" name="quantity_required[]" class="form-control qty-input" step="0.01" min="0" required>
        </td>
        <td>
            <input type="text" name="remarks[]" class="form-control" placeholder="Optional">
        </td>
        <td>
            <button type="button" class="btn btn-sm remove-line-btn">Remove</button>
        </td>
    </tr>
</template>

<style>
.line-stats-hint {
    font-size: 0.78rem;
    color: var(--text-muted, #888);
    margin-top: 0.35rem;
    min-height: 1.1em;
}
.line-stats-hint.stats-warning {
    color: var(--orange, #ff9d3d);
}
.line-stats-hint.stats-danger {
    color: var(--red, #ff3b5f);
    font-weight: 600;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var linesBody = document.getElementById("req-lines-body");
    var addLineBtn = document.getElementById("add-line-btn");
    var lineTemplate = document.getElementById("req-line-template");
    var departmentSelect = document.getElementById("department_id");
    var issuePointSelect = document.getElementById("issue_point");

    addLineBtn.addEventListener("click", function () {
        var clone = lineTemplate.content.cloneNode(true);
        linesBody.appendChild(clone);
    });

    linesBody.addEventListener("click", function (event) {
        if (event.target.classList.contains("remove-line-btn")) {
            var rows = linesBody.querySelectorAll(".req-line-row");
            if (rows.length > 1) {
                event.target.closest(".req-line-row").remove();
            }
        }
    });

    // -----------------------------------------------------------------
    // Live "dept avg / max allowed / stock available" hint
    // -----------------------------------------------------------------
    function renderHint(hintEl, data, row) {
        var parts = [];

        var avgText = (data.avg !== null && data.avg !== undefined) ? data.avg : "no history yet";
        parts.push("Your dept's avg: " + avgText + " · Max allowed: " + (data.max_allowed ?? "—"));

        hintEl.classList.remove("stats-warning", "stats-danger");

        if (data.available_stock !== null && data.available_stock !== undefined) {
            parts.push("In stock at " + data.location + ": " + data.available_stock);

            if (data.available_stock <= 0) {
                hintEl.classList.add("stats-danger");
            } else {
                var qtyInput = row.querySelector(".qty-input");
                var requested = qtyInput ? parseFloat(qtyInput.value) : NaN;
                if (!isNaN(requested) && requested > data.available_stock) {
                    hintEl.classList.add("stats-warning");
                }
            }
        }

        hintEl.textContent = parts.join(" · ");
    }

    function fetchAndShowStats(selectEl) {
        var row = selectEl.closest(".req-line-row");
        var itemId = selectEl.value;
        var hintEl = row.querySelector(".line-stats-hint");

        if (!itemId) {
            hintEl.textContent = "";
            hintEl.classList.remove("stats-warning", "stats-danger");
            return;
        }

        var departmentId = departmentSelect.value;
        var issuePoint = issuePointSelect.value;
        var url = "/api/requisitions/item-stats?item_id=" + encodeURIComponent(itemId);
        if (departmentId) url += "&department_id=" + encodeURIComponent(departmentId);
        if (issuePoint) url += "&location=" + encodeURIComponent(issuePoint);

        hintEl.textContent = "Loading…";
        hintEl.classList.remove("stats-warning", "stats-danger");

        fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (data) { renderHint(hintEl, data, row); })
            .catch(function () {
                hintEl.textContent = "";
            });
    }

    function refreshAllLineHints() {
        linesBody.querySelectorAll(".item-select").forEach(function (select) {
            if (select.value) fetchAndShowStats(select);
        });
    }

    linesBody.addEventListener("change", function (event) {
        if (event.target.classList.contains("item-select") || event.target.classList.contains("qty-input")) {
            var row = event.target.closest(".req-line-row");
            var itemSelect = row.querySelector(".item-select");
            if (itemSelect.value) fetchAndShowStats(itemSelect);
        }
    });

    departmentSelect.addEventListener("change", refreshAllLineHints);
    issuePointSelect.addEventListener("change", refreshAllLineHints);
});
</script>
{% endblock %}
