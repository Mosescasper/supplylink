{# Supply-chain flow illustration: Supplier -> Drug Store -> Holding -> Pharmacy -> Patient #}
<svg viewBox="0 0 240 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Supply chain flow from supplier to patient">

  <line class="chain-line" x1="120" y1="74" x2="120" y2="470"></line>

  <!-- Supplier -->
  <rect class="chain-node" x="30" y="20" width="180" height="54" rx="4"></rect>
  <text class="chain-glyph" x="48" y="53">SUP</text>
  <text class="chain-label" x="90" y="53">Supplier</text>

  <!-- Drug Store -->
  <rect class="chain-node chain-node--active" x="30" y="138" width="180" height="54" rx="4"></rect>
  <text class="chain-glyph" x="48" y="171">DS</text>
  <text class="chain-label" x="90" y="171">Drug Store</text>

  <!-- Holding -->
  <rect class="chain-node" x="30" y="256" width="180" height="54" rx="4"></rect>
  <text class="chain-glyph" x="48" y="289">HD</text>
  <text class="chain-label" x="90" y="289">Holding</text>

  <!-- Pharmacy -->
  <rect class="chain-node" x="30" y="374" width="180" height="54" rx="4"></rect>
  <text class="chain-glyph" x="48" y="407">PH</text>
  <text class="chain-label" x="90" y="407">Pharmacy</text>

  <!-- Patient -->
  <circle class="chain-dot" cx="120" cy="486" r="6"></circle>
  <text class="chain-label" x="90" y="512" text-anchor="middle">Patient</text>

</svg>
