{% extends "base.html" %}

{% block title %}{{ "Edit" if hospital else "Add" }} Hospital{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ "Edit" if hospital else "Add New" }} Hospital</h1>
</div>

<div class="card">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="name">Hospital Name *</label>
            <input type="text" id="name" name="name" class="form-control" 
                   value="{{ hospital.name if hospital else '' }}" 
                   placeholder="e.g., Kenyatta National Hospital" required>
        </div>

        <div class="form-group">
            <label for="code">Hospital Code *</label>
            <input type="text" id="code" name="code" class="form-control" 
                   value="{{ hospital.code if hospital else '' }}" 
                   placeholder="e.g., KNH" required>
            <small class="form-text">Unique identifier (will be converted to uppercase)</small>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" class="form-control" 
                   value="{{ hospital.address or '' }}" 
                   placeholder="Physical address">
        </div>

        <div class="form-group">
            <label for="contact_person">Contact Person</label>
            <input type="text" id="contact_person" name="contact_person" class="form-control" 
                   value="{{ hospital.contact_person or '' }}" 
                   placeholder="Name of primary contact">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" class="form-control" 
                       value="{{ hospital.phone or '' }}" 
                       placeholder="Phone number">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" 
                       value="{{ hospital.email or '' }}" 
                       placeholder="Email address">
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_active" class="checkbox-input"
                       {% if hospital and hospital.is_active %}checked{% elif not hospital %}checked{% endif %}>
                <span class="checkbox-text">Active</span>
            </label>
            <small class="form-text">Uncheck to deactivate this hospital</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {{ "Update" if hospital else "Add" }} Hospital
            </button>
            <a href="{{ url_for('hospital_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<style>
.page-header {
    margin-bottom: 2rem;
}

.page-header h1 {
    margin: 0;
    font-size: 2rem;
    color: #00d4ff;
}

.card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 0.5rem;
    padding: 2rem;
    max-width: 600px;
}

.form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

label {
    display: block;
    margin-bottom: 0.5rem;
    color: #ccc;
    font-weight: 500;
    font-size: 0.95rem;
}

.form-control {
    padding: 0.75rem;
    background: #222;
    border: 1px solid #444;
    border-radius: 0.25rem;
    color: #ccc;
    font-size: 0.95rem;
    font-family: inherit;
}

.form-control:focus {
    outline: none;
    border-color: #00d4ff;
    background: #2a2a2a;
}

.form-text {
    display: block;
    margin-top: 0.25rem;
    color: #999;
    font-size: 0.85rem;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.checkbox-input {
    width: 1.2rem;
    height: 1.2rem;
    cursor: pointer;
}

.checkbox-text {
    color: #ccc;
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
}

.btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 0.25rem;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    display: inline-block;
}

.btn-primary {
    background: #00d4ff;
    color: #000;
}

.btn-secondary {
    background: #444;
    color: #ccc;
    border: 1px solid #666;
}

.btn:hover {
    opacity: 0.8;
}

@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}
